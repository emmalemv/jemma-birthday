<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday Jemma ❤️</title>

<script src="https://unpkg.com/page-flip/dist/js/page-flip.browser.js"></script>

<style>
html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial,sans-serif;
}

#book{
    width:100vw;
    height:100vh;
}

.page{
    position:relative;
    overflow:hidden;
}

.page img{
    width:100%;
    height:100%;
    object-fit:contain;
    display:block;
}

/* Navigation */

.nav{
    position:fixed;
    bottom:20px;
    left:50%;
    transform:translateX(-50%);
    z-index:1000;
}

.nav button{
    padding:12px 24px;
    margin:0 5px;
    border:none;
    border-radius:999px;
    background:#b72f70;
    color:white;
    cursor:pointer;
    font-size:16px;
}

/* Envelope */

.envelope-btn{
    position:absolute;
    left:18%;
    top:18%;
    width:64%;
    height:52%;
    background:transparent;
    border:none;
    cursor:pointer;
}

/* Letter Popup */

#letterPopup{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.9);
    justify-content:center;
    align-items:center;
    z-index:9999;
}

.letterViewer{
    display:flex;
    flex-direction:column;
    align-items:center;
    max-width:95vw;
    max-height:95vh;
}

.letterViewer img{
    max-width:100%;
    max-height:85vh;
    object-fit:contain;
}

.closeBtn{
    margin-top:15px;
    padding:12px 24px;
    border:none;
    border-radius:999px;
    background:white;
    cursor:pointer;
}

/* Candle Button */

.micBtn{
    position:absolute;
    bottom:3%;
    left:50%;
    transform:translateX(-50%);
    padding:14px 24px;
    border:none;
    border-radius:999px;
    background:#b72f70;
    color:white;
    cursor:pointer;
    font-size:18px;
}

/* Candle Flames */

.flame{
    position:absolute;
    width:35px;
    height:45px;
    background:orange;
    border-radius:50%;
    box-shadow:0 0 20px orange;
    animation:flicker .2s infinite alternate;
    cursor:pointer;
    transition:.4s;
}

.flame.out{
    opacity:0;
    transform:scale(0);
    pointer-events:none;
}

@keyframes flicker{
    from{transform:scale(1);}
    to{transform:scale(1.15);}
}

/* Adjust if required */

#f1{
    left:30%;
    top:34%;
}

#f2{
    left:52%;
    top:37%;
}

#f3{
    left:70%;
    top:38%;
}

.confetti{
    position:fixed;
    width:12px;
    height:12px;
    pointer-events:none;
    z-index:99999;
}
</style>
</head>

<body>

<div id="book">

    <!-- Cover -->

    <div class="page">
        <img src="1.png" alt="">
    </div>

    <!-- Envelope -->

    <div class="page">

        <img src="2.png" alt="">

        <button
            class="envelope-btn"
            onclick="openLetter()">
        </button>

    </div>

    <!-- Cake -->

    <div class="page">

        <img src="4.png" alt="">

        <div
            class="flame"
            id="f1"
            onclick="extinguish(this)">
        </div>

        <div
            class="flame"
            id="f2"
            onclick="extinguish(this)">
        </div>

        <div
            class="flame"
            id="f3"
            onclick="extinguish(this)">
        </div>

        <button
            class="micBtn"
            onclick="startMic()">

            Blow Out Candles 🎤

        </button>

    </div>

    <!-- Extra Page -->

    <div class="page">
        <img src="5.png" alt="">
    </div>

    <!-- Extra Page -->

    <div class="page">
        <img src="6.png" alt="">
    </div>

    <div class="page" id="finalPage">
    	<img src="7.png" alt="">
    </div>

</div>

<div class="nav">

    <button onclick="pageFlip.flipPrev()">
        ⬅ Previous
    </button>

    <button onclick="pageFlip.flipNext()">
        Next ➡
    </button>

</div>

<div id="letterPopup">

    <div class="letterViewer">

        <img src="3.png" alt="">

        <button
            class="closeBtn"
            onclick="closeLetter()">

            Close Letter

        </button>

    </div>

</div>

<script>

const pageFlip = new St.PageFlip(
    document.getElementById("book"),
    {
        width:1024,
        height:1536,

        showCover:true,

        size:"stretch",

        useMouseEvents:false,

        mobileScrollSupport:false,

        clickEventForward:false,

        maxShadowOpacity:0.5
    }
);

pageFlip.loadFromHTML(
    document.querySelectorAll(".page")
);

/* Letter */

function openLetter(){

    document
        .getElementById("letterPopup")
        .style.display="flex";
}

function closeLetter(){

    document
        .getElementById("letterPopup")
        .style.display="none";
}

/* Flames */

function extinguish(flame){

    flame.classList.add("out");
}

/* Microphone */

async function startMic(){

    try{

        const stream =
            await navigator.mediaDevices.getUserMedia({
                audio:true
            });

        const context =
            new AudioContext();

        const analyser =
            context.createAnalyser();

        const microphone =
            context.createMediaStreamSource(
                stream
            );

        microphone.connect(
            analyser
        );

        analyser.fftSize = 512;

        const data =
            new Uint8Array(
                analyser.frequencyBinCount
            );

        function listen(){

            analyser
                .getByteFrequencyData(data);

            let max = 0;

            for(let i=0;i<data.length;i++){

                if(data[i] > max){

                    max = data[i];
                }
            }

            if(max > 80){

                document
                    .querySelectorAll(".flame")
                    .forEach(flame => {

                        flame.classList.add("out");

                    });

                return;
            }

            requestAnimationFrame(
                listen
            );
        }

        listen();

    }catch{

        alert(
            "Microphone access denied. You can still click the flames."
        );
    }
}

</script>

</body>
</html>
